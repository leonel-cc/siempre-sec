###############################################
# MediaMTX Configuration for Security AI
###############################################

# RTSP server
rtsp: yes
protocols: [udp, multicast, tcp]
rtspAddress: :8554

# RTMP server
rtmp: yes
rtmpAddress: :1935

# HLS server
hls: yes
hlsAddress: :8888

# API (used by backend health check)
api: yes
apiAddress: :9997

# Logging
logLevel: info
logDestinations: [stdout]

# Open authentication for local use
authInternalUsers:
  - user: any
    ips: [0.0.0.0/0, ::/0]
    permissions:
      - action: publish
      - action: read
      - action: api

# Paths - cameras are added dynamically
paths:
  all_others:

  camera_sim:
