###############################################
# MediaMTX Configuration for Security AI
###############################################

# RTSP server
rtsp: yes
protocols: [rtsp, rtmp, hls]
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888

# API (used by backend health check)
api: yes
apiAddress: :9997

# Logging
logLevel: info
logDestinations: [stdout]

# Paths - cameras are added dynamically
paths:
  all_others:
    source: publisher
    readUser: ""
    readPass: ""
    writeUser: ""
    writePass: ""

  camera_sim:
    source: publisher
    readUser: ""
    readPass: ""
    writeUser: ""
    writePass: ""
