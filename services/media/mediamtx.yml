###############################################
# MediaMTX Configuration for Security AI
###############################################

# RTSP server settings
rtsp: yes
protocols: [udp, multicast, tcp]
rtspAddress: :8554

# RTMP server
rtmp: yes
rtmpAddress: :1935

# HLS server
hls: yes
hlsAddress: :8888

# API
api: yes
apiAddress: :9997

# Logging
logLevel: info
logDestinations: [stdout]

# Open authentication for local development
authInternalUsers:
  - user: any
    ips: [0.0.0.0/0, ::/0]
    permissions:
      - action: publish
      - action: read
      - action: api

# Paths - cameras will be added dynamically
paths:
  # Default path for all streams
  all_others:

  # Simulated camera for development
  camera_sim:
