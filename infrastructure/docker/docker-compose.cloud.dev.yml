services:
  cloud-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_ai_cloud
      POSTGRES_USER: security_ai
      POSTGRES_PASSWORD: security_ai_dev
    ports:
      - "5432:5432"
    volumes:
      - cloud-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_ai -d security_ai_cloud"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cloud-postgres-data:
