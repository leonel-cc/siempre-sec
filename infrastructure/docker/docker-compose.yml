version: '3.8'

services:
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "3000:3000"
    volumes:
      - ../../data:/app/data
      - ../../evidence:/app/evidence
    environment:
      - BACKEND_PORT=3000
      - DATABASE_PATH=/app/data/security-ai.db
      - AI_SERVICE_HOST=ai-service
      - AI_SERVICE_PORT=5000
      - MEDIAMTX_PORT=8554
      - MEDIAMTX_HOST=mediamtx
      - WHATSAPP_ENABLED=${WHATSAPP_ENABLED:-false}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_RECIPIENT_NUMBER=${WHATSAPP_RECIPIENT_NUMBER:-}
    depends_on:
      - ai-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - security-ai

  ai-service:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.ai
    ports:
      - "5000:5000"
    volumes:
      - ../../evidence:/app/evidence
      - ai-models:/app/models
    environment:
      - AI_SERVICE_PORT=5000
      - AI_SERVICE_HOST=0.0.0.0
      - BACKEND_URL=http://backend:3000
      - YOLO_MODEL=yolov8n.pt
      - YOLO_CONFIDENCE_THRESHOLD=0.5
      - INFERENCE_FPS=5
      - FACE_RECOGNITION_THRESHOLD=0.6
      - EVIDENCE_DIR=/app/evidence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - security-ai

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"
      - "8555:8555"
      - "1935:1935"
      - "8888:8888"
      - "9997:9997"
    volumes:
      - ../../services/media/mediamtx.yml:/mediamtx.yml
    restart: unless-stopped
    networks:
      - security-ai

networks:
  security-ai:
    driver: bridge

volumes:
  ai-models:
